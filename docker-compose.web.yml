services:
  # Backend API (FastAPI)
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: auto-claude-backend
    # Run as host user to prevent file ownership issues
    # Docker creates files as root by default, which causes:
    # 1. Git safe.directory errors on host
    # 2. SourceTree/git GUIs unable to see changes
    # 3. Files owned by root:root inaccessible to host user
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - HOME=/tmp  # Set HOME for non-root user to have writable directory
    env_file:
      - .env.docker
    volumes:
      - ./code:/home/code
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Frontend Web (Nginx serving static files)
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.web
    container_name: auto-claude-web
    ports:
      - "3000:80"
    environment:
      - VITE_CUSTOM_DOMAIN=${VITE_CUSTOM_DOMAIN:-notesvnn.click}
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
