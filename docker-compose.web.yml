services:
  # Backend API (FastAPI)
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: auto-claude-backend
    ports:
      - "8000:8000"
    # Run as host user to ensure write permissions to mounted volumes
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - PYTHONUNBUFFERED=1
      - HOME=/tmp
      # Git config for worktree operations
      - GIT_CONFIG_GLOBAL=/tmp/.gitconfig
      - GIT_DISCOVERY_ACROSS_FILESYSTEM=1
    env_file:
      - .env.docker
    volumes:
      # Mount the code directory with full read-write access
      - ./code:/home/code:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Frontend Web (Nginx serving static files)
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.web
    container_name: auto-claude-web
    ports:
      - "3000:80"
    environment:
      - VITE_CUSTOM_DOMAIN=${VITE_CUSTOM_DOMAIN:-notesvnn.click}
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
